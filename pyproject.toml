[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-mixing-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
audio-mixing-claim-audit = "audio_mixing_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["audio_mixing_claim_audit*", "tests"]
